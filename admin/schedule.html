<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>予定の更新｜中京教会（管理用）</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EA; --paper-deep:#F1E8D6; --ink:#2E2A22; --ink-soft:#6B6252;
    --wood:#A9713F; --wood-deep:#7C4F2A; --sky-deep:#4F7590;
    --line: rgba(46,42,34,0.16); --shadow: 0 14px 30px rgba(70,54,26,0.10);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif; line-height:1.7;
    padding: 30px 16px 100px;
  }
  h1{ font-family:'Shippori Mincho B1', serif; font-size:1.4rem; margin: 0 0 4px; }
  .sub{ color:var(--ink-soft); font-size:0.85rem; margin: 0 0 24px; }
  .wrap{ max-width: 640px; margin: 0 auto; }
  .card{ background:#fff; border-radius:14px; padding:20px; box-shadow:var(--shadow); margin-bottom:18px; }
  label{ display:block; font-size:0.8rem; color:var(--ink-soft); margin-bottom:6px; }
  input[type=text], input[type=password], input[type=date], textarea{
    width:100%; font-family:inherit; font-size:1rem; padding:10px 12px;
    border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink);
    margin-bottom:14px; resize:vertical;
  }
  textarea{ min-height:90px; }
  .day-card{ border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; background:var(--paper-deep); }
  .btn{
    display:inline-block; border:none; border-radius:999px; padding:11px 22px; font-size:0.9rem;
    cursor:pointer; font-family:inherit; font-weight:500;
  }
  .btn-primary{ background:var(--wood-deep); color:var(--paper); }
  .btn-primary:hover{ background:var(--wood); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--wood); color:var(--wood-deep); }
  .btn-danger{ background:transparent; color:#b04a3a; border:1px solid rgba(176,74,58,0.3); font-size:0.8rem; padding:6px 14px; }
  .btn-danger:hover{ background:rgba(176,74,58,0.06); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .status{ font-size:0.88rem; margin-top:10px; min-height:1.4em; color:var(--sky-deep); }
  .status.error{ color:#b04a3a; }
  .day-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .day-head .dow{ font-size:0.8rem; color:var(--wood-deep); font-weight:600; }
  #lockScreen{ max-width:360px; margin: 20vh auto 0; text-align:center; }
  #app{ display:none; }
</style>
</head>
<body>

<div class="wrap">

  <div id="lockScreen" class="card">
    <h1>予定の更新</h1>
    <p class="sub">中京教会サイト管理用ページ</p>
    <label for="pw">パスワード</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="btn btn-primary" id="unlockBtn" style="width:100%;">開く</button>
    <p class="status" id="lockStatus"></p>
  </div>

  <div id="app">
    <h1>今月の予定を更新</h1>
    <p class="sub">日付はカレンダーから選ぶだけです。曜日は自動で判定されるので入力の必要はありません。保存すると数分でサイトに反映されます。</p>

    <div id="daysContainer"></div>

    <button class="btn btn-ghost" id="addDayBtn" style="width:100%; margin-bottom:20px;">＋ 日を追加する</button>

    <div class="card actions">
      <button class="btn btn-primary" id="saveBtn">保存する</button>
      <button class="btn btn-ghost" id="reloadBtn">読み込み直す</button>
    </div>
    <p class="status" id="saveStatus"></p>
  </div>

</div>

<template id="dayTemplate">
  <div class="day-card">
    <div class="day-head">
      <span class="dow"></span>
      <button type="button" class="btn-danger removeDayBtn">この日を削除</button>
    </div>
    <label>日付</label>
    <input type="date" class="dateInput">
    <label>見出し（例：聖霊降臨節第7主日／水曜）</label>
    <input type="text" class="labelInput" placeholder="聖霊降臨節第7主日">
    <label>予定の内容（1行に1つずつ）</label>
    <textarea class="itemsInput" placeholder="教会学校 9:00
求道者会 9:40
主日礼拝 10:30〜12:00（聖餐式）"></textarea>
  </div>
</template>

<script>
const API = '/api/schedule';
const DOWS = ['日','月','火','水','木','金','土'];
let sessionPassword = '';

const lockScreen = document.getElementById('lockScreen');
const app = document.getElementById('app');
const pwInput = document.getElementById('pw');
const lockStatus = document.getElementById('lockStatus');
const daysContainer = document.getElementById('daysContainer');
const dayTemplate = document.getElementById('dayTemplate');
const saveStatus = document.getElementById('saveStatus');

document.getElementById('unlockBtn').addEventListener('click', unlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('addDayBtn').addEventListener('click', () => addDayCard());
document.getElementById('saveBtn').addEventListener('click', save);
document.getElementById('reloadBtn').addEventListener('click', () => loadSchedule());

async function unlock(){
  const pw = pwInput.value.trim();
  if (!pw){
    lockStatus.textContent = 'パスワードを入力してください';
    lockStatus.classList.add('error');
    return;
  }
  sessionPassword = pw;
  lockScreen.style.display = 'none';
  app.style.display = 'block';
  await loadSchedule();
}

async function loadSchedule(){
  saveStatus.textContent = '読み込み中…';
  saveStatus.classList.remove('error');
  try{
    const res = await fetch(API, { cache: 'no-store' });
    const data = await res.json();
    daysContainer.innerHTML = '';
    (data.items || []).forEach(item => addDayCard(item));
    if (!(data.items || []).length){
      saveStatus.textContent = 'まだ予定が保存されていません。「＋ 日を追加する」から始めてください。';
    } else {
      saveStatus.textContent = '読み込みました。';
    }
  }catch(err){
    console.error(err);
    saveStatus.textContent = '読み込みに失敗しました。通信環境をご確認ください。';
    saveStatus.classList.add('error');
  }
}

function addDayCard(item){
  const node = dayTemplate.content.cloneNode(true);
  const card = node.querySelector('.day-card');
  const dateInput = node.querySelector('.dateInput');
  const labelInput = node.querySelector('.labelInput');
  const itemsInput = node.querySelector('.itemsInput');
  const dowEl = node.querySelector('.dow');
  const removeBtn = node.querySelector('.removeDayBtn');

  if (item){
    dateInput.value = item.date || '';
    labelInput.value = item.label || '';
    itemsInput.value = (item.items || []).join('\n');
  }
  updateDow(dateInput, dowEl);
  dateInput.addEventListener('change', () => updateDow(dateInput, dowEl));
  removeBtn.addEventListener('click', () => card.remove());
  daysContainer.appendChild(node);
}

function updateDow(dateInput, dowEl){
  if (!dateInput.value){ dowEl.textContent = ''; return; }
  const d = new Date(dateInput.value + 'T00:00:00');
  dowEl.textContent = `${d.getMonth() + 1}月${d.getDate()}日（${DOWS[d.getDay()]}）`;
}

async function save(){
  const items = Array.from(daysContainer.querySelectorAll('.day-card')).map(card => ({
    date: card.querySelector('.dateInput').value,
    label: card.querySelector('.labelInput').value.trim(),
    items: card.querySelector('.itemsInput').value.split('\n').map(s => s.trim()).filter(Boolean)
  })).filter(it => it.date);

  const payload = { password: sessionPassword, items };

  saveStatus.textContent = '保存中…';
  saveStatus.classList.remove('error');

  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok || !data.ok){
      throw new Error(data.error || '保存に失敗しました');
    }
    saveStatus.textContent = '✓ 保存しました。数分でサイトに反映されます。';
  }catch(err){
    console.error(err);
    saveStatus.textContent = err.message || '保存に失敗しました。パスワードをご確認ください。';
    saveStatus.classList.add('error');
  }
}
</script>
</body>
</html>
